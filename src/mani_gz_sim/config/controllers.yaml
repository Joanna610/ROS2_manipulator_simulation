controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - platform_joint
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity